name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    attributes:
      label: devengine version
      placeholder: v0.3.0
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Provide the smallest runnable example and relevant logs.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Go version, operating system, and PostgreSQL version if relevant.
    validations:
      required: true
