name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

jobs:
  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27'
          cache: true

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: govulncheck
        run: govulncheck ./...

  dependency-review:
    name: Dependency review
    # GitHub Dependency Review for private repositories requires GitHub Code
    # Security. Run automatically when the repository is public; private
    # repositories enable this job after licensing the feature.
    if: github.event_name == 'pull_request' && github.repository_visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@5ba2889ada762081db2c4f32a729827dce632c7b # v4

  codeql:
    name: CodeQL
    # Private repositories require GitHub Code Security for CodeQL default
    # setup. Keep this gate ready without making CI fail on unsupported plans.
    if: github.repository_visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: go
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
