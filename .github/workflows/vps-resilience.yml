name: VPS Resilience

on:
  workflow_dispatch:
    inputs:
      stress_count:
        description: Number of jobs and outbox messages to process
        required: true
        default: '100000'
        type: string
      postgres:
        description: PostgreSQL version
        required: true
        default: '18'
        type: choice
        options:
          - '17'
          - '18'
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: devengine-vps-resilience
  cancel-in-progress: false

jobs:
  resilience:
    name: Stress and restart recovery
    runs-on: [self-hosted, Linux, X64, devengine-stress]
    timeout-minutes: 45
    env:
      PG_CONTAINER: devengine-ci-postgres-${{ github.run_id }}
      PG_VOLUME: devengine-ci-postgres-${{ github.run_id }}
      PG_PORT: '55432'
      TEST_DATABASE_URL: postgres://devengine:devengine@127.0.0.1:55432/devengine_test?sslmode=disable
      DEVENGINE_STRESS_COUNT: ${{ inputs.stress_count || '100000' }}
      POSTGRES_VERSION: ${{ inputs.postgres || '18' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Start isolated PostgreSQL
        run: |
          set -euo pipefail
          docker volume create "$PG_VOLUME"
          docker run --detach --name "$PG_CONTAINER" \
            --cpus 2 --memory 3g --memory-swap 3g \
            --publish "127.0.0.1:${PG_PORT}:5432" \
            --volume "$PG_VOLUME:/var/lib/postgresql" \
            --env POSTGRES_USER=devengine \
            --env POSTGRES_PASSWORD=devengine \
            --env POSTGRES_DB=devengine_test \
            "postgres:${POSTGRES_VERSION}"
          for attempt in $(seq 1 60); do
            if docker exec "$PG_CONTAINER" pg_isready -U devengine -d devengine_test; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$PG_CONTAINER")" != true ]; then
              docker logs "$PG_CONTAINER"
              exit 1
            fi
            sleep 1
          done
          docker logs "$PG_CONTAINER"
          exit 1

      - name: Pull Go toolchain image
        run: docker pull golang:1.27-bookworm

      - name: Run 100k backlog stress
        run: |
          docker run --rm --network host --cpus 3 --memory 3g --memory-swap 3g \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            --env TEST_DATABASE_URL --env DEVENGINE_STRESS_COUNT \
            golang:1.27-bookworm \
            go test -count=1 -timeout=35m -run TestBacklog -v ./stress

      - name: Verify recovery across a database restart
        run: |
          set -euo pipefail
          control_dir="$RUNNER_TEMP/devengine-chaos-${GITHUB_RUN_ID}"
          mkdir -p "$control_dir"
          chmod 777 "$control_dir"
          docker run --rm --network host --cpus 2 --memory 2g --memory-swap 2g \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            --volume "$control_dir:/control" \
            --env TEST_DATABASE_URL --env DEVENGINE_CHAOS_CONTROL_DIR=/control \
            golang:1.27-bookworm \
            go test -count=1 -timeout=6m -run TestWorkerRecoversAfterDatabaseRestart -v ./jobs &
          test_pid=$!
          for attempt in $(seq 1 120); do
            if [ -f "$control_dir/handler-started" ]; then
              break
            fi
            if ! kill -0 "$test_pid" 2>/dev/null; then
              wait "$test_pid"
            fi
            sleep 1
          done
          test -f "$control_dir/handler-started"
          docker restart --time 5 "$PG_CONTAINER"
          for attempt in $(seq 1 60); do
            if docker exec "$PG_CONTAINER" pg_isready -U devengine -d devengine_test; then
              break
            fi
            sleep 1
          done
          touch "$control_dir/release-handler"
          wait "$test_pid"

      - name: Container diagnostics
        if: failure()
        run: |
          docker logs "$PG_CONTAINER" || true
          docker stats --no-stream "$PG_CONTAINER" || true

      - name: Remove isolated test resources
        if: always()
        run: |
          docker rm --force "$PG_CONTAINER" 2>/dev/null || true
          docker volume rm "$PG_VOLUME" 2>/dev/null || true
