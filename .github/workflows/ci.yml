name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Unit tests (no database required) ────────────────────────────────────
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "The following files need formatting:"
            echo "$out"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

  # ── Integration tests (requires PostgreSQL) ───────────────────────────────
  integration:
    name: Integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: devengine
          POSTGRES_PASSWORD: devengine
          POSTGRES_DB: devengine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: integration tests
        env:
          TEST_DATABASE_URL: postgres://devengine:devengine@localhost:5432/devengine_test?sslmode=disable
        run: go test -race -count=1 ./...
